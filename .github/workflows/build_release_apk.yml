name: Nexus Launcher Compile (release)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-launcher-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Compile Nexus Launcher (release)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source and bundled modules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Compile release APK and Play bundle
        run: ./gradlew --no-daemon assembleLawnWithQuickstepGithubRelease bundleLawnWithQuickstepPlayRelease

      - name: Upload release outputs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-launcher-release-${{ github.sha }}
          path: build/outputs/**
          if-no-files-found: error
          retention-days: 7

      - name: Summarize result
        if: always()
        run: |
          {
            echo "## Nexus Launcher release compile"
            echo ""
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Build status: see job result above"
          } >> "$GITHUB_STEP_SUMMARY"
