name: Nexus Launcher Debug Compile

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nexus-launcher-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Compile Nexus Launcher (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source and bundled modules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Apply Kotlin and Java formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Build Nexus Launcher for testing
        run: ./gradlew --no-daemon assembleLawnWithQuickstepGithubDebug

      - name: Check app code quality
        if: success()
        run: ./gradlew --no-daemon spotlessCheck

      - name: Upload debug APK for testing
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-launcher-debug-${{ github.sha }}
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Summarize result
        if: always()
        run: |
          {
            echo "## Nexus Launcher debug compile"
            echo ""
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Build and formatting status: see job result above"
          } >> "$GITHUB_STEP_SUMMARY"
