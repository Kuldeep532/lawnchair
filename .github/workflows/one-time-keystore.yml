name: One-time Android signing keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse to expose signing material from a public repository
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_IS_PRIVATE" != "true" ]; then
            echo "::error::This workflow intentionally refuses to generate or upload signing material while the repository is public. Make the repository private first, then run this workflow manually."
            exit 1
          fi

      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Generate release keystore and password file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing-bundle
          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_ALIAS="nexus-release"
          keytool -genkeypair \
            -keystore signing-bundle/nexus-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=Nexus Launcher, OU=Android, O=Nexus Wave Technologies, L=India, S=Madhya Pradesh, C=IN"
          cat > signing-bundle/keystore.properties <<EOF
          storeFile=nexus-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$STORE_PASSWORD
          EOF
          cat > signing-bundle/README.txt <<'EOF'
          Nexus Launcher release signing bundle
          
          Keep nexus-release.jks and keystore.properties together and private.
          The properties file contains the signing passwords in plain text.
          Never commit either file to the source repository or share this bundle.
          Back up this bundle securely; losing it may prevent updates signed with this key.
          EOF
          chmod 600 signing-bundle/nexus-release.jks signing-bundle/keystore.properties
          # Package only the signing material needed by the owner. Do not print passwords to logs.
          cd signing-bundle
          zip -q -9 ../nexus-signing-bundle.zip nexus-release.jks keystore.properties README.txt
          cd ..
          sha256sum nexus-signing-bundle.zip

      - name: Make the bundle available for download for one day
        uses: actions/upload-artifact@v4
        with:
          name: nexus-signing-bundle-one-time
          path: nexus-signing-bundle.zip
          if-no-files-found: error
          retention-days: 1

      - name: Destroy the one-time workflow after successful generation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-keystore.yml
          git commit -m "Remove one-time keystore generation workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
