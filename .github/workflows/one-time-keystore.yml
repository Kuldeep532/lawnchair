name: One-time Android signing keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Generate release keystore and password file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing-bundle
          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_ALIAS="nexus-launcher"
          keytool -genkeypair \
            -keystore signing-bundle/app-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=Kuldeep Kumar, OU=Android Dev, O=Personal, L=Korba, S=Chhattisgarh, C=IN"

          cat > signing-bundle/keystore.properties <<EOF
          storeFile=app-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$STORE_PASSWORD
          EOF

          cat > signing-bundle/README.txt <<'EOF'
          Release signing bundle
          Keep app-release.jks and keystore.properties together and private.
          The properties file contains the signing passwords in plain text.
          Never commit either file to the source repository or share this bundle.
          Back up this bundle securely; losing it may prevent updates signed with this key.
          EOF

          chmod 600 signing-bundle/app-release.jks signing-bundle/keystore.properties

          # Package only the signing material needed by the owner. Do not print passwords to logs.
          cd signing-bundle
          zip -q -9 ../signing-bundle.zip app-release.jks keystore.properties README.txt
          cd ..
          sha256sum signing-bundle.zip

      - name: Make the bundle available for download for one day
        uses: actions/upload-artifact@v4
        with:
          name: signing-bundle-one-time
          path: signing-bundle.zip
          if-no-files-found: error
          retention-days: 1

      - name: Destroy the one-time workflow after successful generation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-keystore.yml
          git commit -m "Remove one-time keystore generation workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
